# =====================================================================
# Flujo de CI/CD para Despliegue Automatizado en Firebase Hosting
# Proyecto: asesor-financiero-83679
# Repositorio: https://github.com/Carlosangel86/asesor-financiero
# =====================================================================

name: Deploy to Firebase Hosting on push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASESOR_FINANCIERO_83679 || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_CFO_COPILOT_FINANZAS || secrets.FIREBASE_SERVICE_ACCOUNT_KEY || secrets.FIREBASE_CREDENTIALS || vars.FIREBASE_SERVICE_ACCOUNT_ASESOR_FINANCIERO_83679 || vars.FIREBASE_SERVICE_ACCOUNT || vars.FIREBASE_SERVICE_ACCOUNT_CFO_COPILOT_FINANZAS }}

      - name: Deploy to Firebase Hosting
        id: deploy
        run: |
          set +e
          echo "Iniciando despliegue en Firebase Hosting..."
          npx --yes firebase-tools@13.29.1 deploy --only hosting --project asesor-financiero-83679 --debug > /tmp/deploy.log 2>&1
          STATUS=$?
          cat /tmp/deploy.log
          
          if [ $STATUS -eq 0 ]; then
            echo "::notice title=Despliegue Exitoso::Firebase Hosting ha sido desplegado exitosamente."
            echo "### ✅ ¡Despliegue Exitoso en Firebase Hosting!" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **URL en Vivo:** [https://asesor-financiero-83679.web.app](https://asesor-financiero-83679.web.app)" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **Dominio Alternativo:** [https://asesor-financiero-83679.firebaseapp.com](https://asesor-financiero-83679.firebaseapp.com)" >> $GITHUB_STEP_SUMMARY
          else
            ERR_LINE=$(grep -i "error:" /tmp/deploy.log | tail -n 5 | tr '\n' ' -- ')
            echo "::error title=Firebase CLI Result::Exit Code $STATUS | $ERR_LINE"
            echo "### ❌ Error en el Despliegue de Firebase Hosting" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/deploy.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $STATUS
