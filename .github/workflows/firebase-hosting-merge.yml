# =====================================================================
# Flujo de CI/CD para Despliegue Automatizado en Firebase Hosting
# Proyecto: asesor-financiero-83679
# Repositorio: https://github.com/Carlosangel86/asesor-financiero
# =====================================================================

name: Deploy to Firebase Hosting on push

on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASESOR_FINANCIERO_83679 }}
          channelId: live
          projectId: asesor-financiero-83679
